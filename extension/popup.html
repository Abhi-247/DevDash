<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDash Outreach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>

<body class="light">
    <div class="popup-container">
        <!-- Top App Bar -->
        <header class="app-header">
            <div class="brand">
                <img src="icons/icon48.png" alt="DevDash Logo" class="brand-logo">
                <span class="brand-text">Dev<span class="brand-accent">Dash</span></span>
            </div>
            <div class="header-right">
                <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
                    <span>⚙️</span>
                </button>
            </div>
        </header>

        <!-- Loading View -->
        <div id="view-loading" class="view-state">
            <div class="spinner"></div>
            <p class="loading-text">Syncing with DevDash...</p>
        </div>

        <!-- Auth Required View -->
        <div id="view-unauth" class="view-state hidden">
            <div class="auth-box">
                <div class="auth-icon">🔐</div>
                <h3>Connect to DevDash</h3>
                <p>Log in to access your Resume Vault, verified DevScore™, and connected Gmail SMTP.</p>
                <button id="btn-login" class="primary-btn">Log in to DevDash</button>
                <div class="auth-manual">
                    <p class="small-text">Or paste your JWT Auth Token:</p>
                    <div class="input-group">
                        <input type="password" id="input-token">
                        <button id="btn-save-token" class="secondary-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Composer View -->
        <main id="view-composer" class="view-state hidden">
            <!-- Detected Job Banner -->
            <div class="section-card">
                <div class="card-header">
                    <div class="card-title-group">
                        <span class="status-dot"></span>
                        <span class="card-title">Job Details</span>
                    </div>
                    <button id="btn-re-scrape" class="link-btn" title="Re-scan current tab">
                        <span class="btn-icon-spin">↻</span> Re-scan Page
                    </button>
                </div>
                <div class="grid-2">
                    <div class="field">
                        <label>Company *</label>
                        <input type="text" id="job-company">
                    </div>
                    <div class="field">
                        <label>Position *</label>
                        <input type="text" id="job-position">
                    </div>
                </div>
                <div class="field mt-2">
                    <label>HR / Recruiter Email *</label>
                    <input type="email" id="job-email">
                </div>
            </div>

            <!-- Email Message -->
            <div class="section-card mt-2">
                <div class="field">
                    <label>Subject Line *</label>
                    <input type="text" id="email-subject">
                </div>

                <div class="field mt-2">
                    <label>Message Body *</label>
                    <textarea id="email-body" rows="5"></textarea>
                </div>

                <!-- Resume Picker -->
                <div class="field mt-2">
                    <label>Attach Resume from DevDash</label>
                    <select id="select-resume">
                        <option value="">Loading DevDash Resumes...</option>
                    </select>
                </div>
            </div>

            <!-- Actions Footer -->
            <div class="composer-footer">
                <div id="status-message" class="status-msg hidden"></div>
                <button id="btn-send-email" class="send-btn">
                    <span id="send-btn-spinner" class="btn-spinner hidden"></span>
                    <span id="send-btn-text">Send</span>
                </button>
                <div class="footer-links">
                    <button id="btn-open-crm" class="crm-link-btn">
                        <span>Open DevDash HR Outreach CRM</span>
                        <span class="arrow-icon">→</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="popup.js"></script>
</body>

</html>
